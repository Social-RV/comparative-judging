[project]
name = "comparative-judging"
version = "0.1.0"
description = "Open Source Implementation of Comparative Judging for Remote Viewing Sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML/AI
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    
    # HTTP client for API access
    "requests>=2.31.0",
    "httpx>=0.27.0",
    
    # Data processing
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",  # Excel support
    "Pillow>=10.0.0",   # Image processing
    "pymupdf>=1.24.0",  # PDF handling
    
    # Environment and config
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    
    # Jupyter support
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

